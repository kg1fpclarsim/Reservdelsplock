<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaufförsplock</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chaufförsplock">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Chauff%C3%B6rsplock%22%2C%22short_name%22%3A%22C-Plock%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%7D'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-[100dvh] flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white p-4 shadow-md z-10 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <i data-lucide="truck" class="w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-wide">Chaufförsplock</h1>
            <div id="header-order-badge" class="hidden ml-2 bg-indigo-500 px-3 py-1 rounded-full text-sm font-semibold border border-indigo-400"></div>
        </div>
    </header>

    <!-- Kraftig padding i botten (pb-32) -->
    <main id="main-ui" class="flex-grow p-4 pb-32 overflow-y-auto flex flex-col gap-4">
        
        <div id="step-order" class="flex flex-col items-center justify-center flex-grow space-y-6">
            <div class="text-center space-y-2 mb-2">
                <h2 class="text-3xl font-bold text-slate-700">Registrera Delar</h2>
                <p class="text-slate-500 font-medium">Ange Regnr eller Internnr på ditt fordon.</p>
            </div>
            <div class="w-full max-w-sm flex flex-col gap-3">
                <div class="relative w-full">
                    <input type="text" id="manual-order-input" placeholder="T.ex. OEJ634 eller DM10" class="w-full bg-white border-2 border-slate-300 rounded-xl px-4 py-5 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 uppercase text-lg font-bold text-center tracking-wider transition-all shadow-sm">
                    <div id="order-autocomplete-dropdown" class="hidden absolute top-full mt-2 w-full bg-white border border-slate-200 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-[60] divide-y divide-slate-100 text-sm text-left"></div>
                </div>
                <button onclick="setManualOrder()" class="w-full bg-indigo-600 text-white rounded-xl py-4 font-bold text-lg hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-md flex items-center justify-center gap-2">
                    <i data-lucide="arrow-right-circle" class="w-5 h-5"></i>
                    Öppna / Skapa
                </button>
            </div>
        </div>

        <div id="step-parts" class="hidden flex-col gap-4">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 shrink-0">
                <div class="text-xs text-slate-400 uppercase font-semibold mb-1">Aktivt Fordon</div>
                <div class="flex justify-between items-center">
                    <div id="current-order-display" class="text-2xl font-bold text-slate-800">DM10</div>
                    <button onclick="attemptClearOrder()" class="text-red-500 hover:bg-red-50 p-2 rounded-lg text-sm font-medium transition-colors">Stäng</button>
                </div>
            </div>

            <!-- Manuell inmatning av reservdel (Med sökning och Filterknappar) -->
            <div class="bg-indigo-50 p-4 rounded-xl shadow-sm border border-indigo-100 shrink-0 flex flex-col gap-3">
                <label class="text-sm font-bold text-indigo-900 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Lägg till reservdel
                </label>
                
                <div class="flex flex-col gap-3">
                    <!-- Sökfältet -->
                    <div class="relative w-full">
                        <input type="text" id="manual-part-input" placeholder="Sök namn, artikelnr..." class="w-full bg-white border-2 border-slate-300 rounded-xl px-4 py-4 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 uppercase text-lg font-bold text-center tracking-wider transition-all shadow-sm">
                        <div id="autocomplete-dropdown" class="hidden absolute top-full mt-2 w-full bg-white border border-slate-200 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-[60] divide-y divide-slate-100 text-sm text-left"></div>
                    </div>
                    
                    <!-- Lager-Filter (Snabba knappar genereras nu dynamiskt) -->
                    <div id="location-filter-container" class="flex items-center gap-2 overflow-x-auto hide-scrollbar w-full pb-1">
                        <span class="text-xs font-bold text-slate-400 uppercase mr-1 shrink-0">Lager:</span>
                        <button id="loc-btn-ALLA" onclick="window.setLocationFilter('ALLA')" class="loc-btn px-4 py-1.5 rounded-full text-sm font-bold bg-indigo-600 text-white transition-colors shadow-sm shrink-0">Alla</button>
                        <span class="text-xs text-slate-400 italic">Laddar lager...</span>
                    </div>

                    <!-- Fullbredds-knapp -->
                    <button onclick="addManualPart()" class="w-full bg-indigo-600 text-white rounded-xl py-4 font-bold text-lg hover:bg-indigo-700 active:bg-indigo-800 transition-colors shadow-md flex items-center justify-center gap-2 mt-1">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        Lägg till i listan
                    </button>
                </div>
            </div>

            <div class="flex-grow bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[150px] z-10">
                <div class="bg-slate-50 p-3 border-b border-slate-200 text-sm font-semibold text-slate-600 flex justify-between items-center">
                    <span>Plockade artiklar</span>
                    <span id="part-count-badge" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-xs hidden">0 st</span>
                </div>
                <div id="parts-list" class="overflow-y-auto p-2 flex-grow"></div>
            </div>

            <label class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex items-center justify-between cursor-pointer shrink-0 hover:bg-slate-50 transition-colors">
                <div class="flex flex-col">
                    <span class="font-bold text-slate-800 text-lg">Plockningen är färdig</span>
                    <span class="text-xs text-slate-500">Kryssa i om du plockat klart allt</span>
                </div>
                <input type="checkbox" id="order-finished-cb" onchange="window.markUnsaved()" class="w-7 h-7 accent-green-600 rounded cursor-pointer">
            </label>

            <button onclick="window.finishOrder()" id="finish-btn" class="w-full bg-indigo-600 text-white rounded-xl p-4 text-lg font-bold shadow-md opacity-50 cursor-not-allowed transition-opacity shrink-0 flex items-center justify-center gap-2 hover:bg-indigo-700 active:bg-indigo-800">
                <i data-lucide="save" class="w-6 h-6"></i>
                Skicka in reservdelar
            </button>
        </div>
    </main>

    <!-- Modaler -->
    <div id="confirm-modal" class="hidden absolute inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm transform transition-all">
            <div class="flex items-center gap-3 text-red-600 mb-4"><div class="bg-red-100 p-2 rounded-full text-red-600"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div><h3 class="text-xl font-bold text-slate-800">Ta bort artikel?</h3></div>
            <p class="text-slate-600 mb-6" id="confirm-modal-text">Är du säker på att du vill ta bort artikeln?</p>
            <div class="flex gap-3">
                <button onclick="window.cancelRemove()" class="flex-1 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-colors">Avbryt</button>
                <button onclick="window.confirmRemove()" class="flex-1 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold py-3 rounded-xl transition-colors shadow-sm">Ja, ta bort</button>
            </div>
        </div>
    </div>

    <div id="unsaved-modal" class="hidden absolute inset-0 bg-slate-900/60 z-[75] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm transform transition-all border-t-8 border-orange-500">
            <div class="flex items-center gap-3 text-orange-600 mb-3"><div class="bg-orange-100 p-2 rounded-full text-orange-600"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div><h3 class="text-xl font-bold text-slate-800">Osparade ändringar</h3></div>
            <p class="text-slate-600 mb-6 text-sm font-medium">Du har gjort ändringar som inte skickats in.</p>
            <div class="flex flex-col gap-3">
                <button onclick="window.closeUnsavedModal(); window.finishOrder();" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-4 rounded-xl transition-colors shadow-sm text-lg flex items-center justify-center gap-2"><i data-lucide="save" class="w-5 h-5"></i> Skicka in delar</button>
                <div class="flex gap-3 mt-1">
                    <button onclick="window.closeUnsavedModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-colors">Avbryt</button>
                    <button onclick="window.forceClearOrder()" class="flex-1 bg-red-50 hover:bg-red-100 active:bg-red-200 text-red-700 font-bold py-3 rounded-xl transition-colors">Stäng ändå</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-transform duration-300 translate-y-[150%] z-50 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="info" class="w-5 h-5"></i><span id="toast-msg">Meddelande</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.showToast = function(msg, type = 'info') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            if(type === 'success') toast.className = "fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl transition-transform duration-300 z-50 flex items-center gap-2 whitespace-nowrap";
            else if(type === 'error') toast.className = "fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full shadow-2xl transition-transform duration-300 z-50 flex items-center gap-2 whitespace-nowrap";
            else toast.className = "fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-transform duration-300 z-50 flex items-center gap-2 whitespace-nowrap";
            toast.classList.remove('translate-y-[150%]');
            setTimeout(() => toast.classList.add('translate-y-[150%]'), 3000);
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDdzRwnqZZmI-IKEqGFX6t-SlaogHFnYEA",
            authDomain: "smalands-logistik-verkstad.firebaseapp.com",
            projectId: "smalands-logistik-verkstad",
            storageBucket: "smalands-logistik-verkstad.firebasestorage.app",
            messagingSenderId: "916947926799",
            appId: "1:916947926799:web:b406d72a2379848b03087a",
            measurementId: "G-JRBQ6C48XM"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'smalands-logistik-verkstad';

        let currentUser = null;
        const initAuth = async () => { try { await signInAnonymously(auth); } catch (err) {} };
        initAuth();

        onAuthStateChanged(auth, (user) => { currentUser = user; });

        // --- LÄS IN ARTIKEL & FORDON-REGISTER ---
        let articleDatabase = [];
        let vehicleDatabase = [];

        fetch('artiklar.json')
            .then(res => { if(!res.ok) throw new Error(); return res.json(); })
            .then(data => { 
                articleDatabase = data; 
                window.generateLocationButtons(data); 
            })
            .catch(e => console.log("Hittade inget artikelregister."));

        fetch('fordon.json')
            .then(res => { if(!res.ok) throw new Error(); return res.json(); })
            .then(data => { vehicleDatabase = data; })
            .catch(e => console.log("Hittade inget fordonsregister."));

        // --- FORDON SÖKNING (AUTOCOMPLETE) ---
        const orderInput = document.getElementById('manual-order-input');
        const orderDropdown = document.getElementById('order-autocomplete-dropdown');

        orderInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            orderDropdown.innerHTML = '';
            if (val.length < 1 || vehicleDatabase.length === 0) { orderDropdown.classList.add('hidden'); return; }

            const matches = vehicleDatabase.filter(v => 
                v.r.toLowerCase().includes(val) || (v.i && v.i.toLowerCase().includes(val))
            ).slice(0, 10);

            if (matches.length > 0) {
                orderDropdown.classList.remove('hidden');
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'p-3 hover:bg-indigo-50 cursor-pointer flex flex-col gap-1 transition-colors';
                    const displayTitle = match.i ? match.i : match.r;
                    const displaySub = match.i ? `Regnr: ${match.r}` : 'Fordon';
                    
                    div.innerHTML = `
                        <div class="font-bold text-slate-800 leading-tight uppercase">${displayTitle}</div>
                        <div class="text-xs text-slate-500 leading-tight">${displaySub}</div>
                    `;
                    div.onclick = () => {
                        orderInput.value = match.i ? match.i : match.r; 
                        orderDropdown.classList.add('hidden');
                        window.setManualOrder(); 
                    };
                    orderDropdown.appendChild(div);
                });
            } else { orderDropdown.classList.add('hidden'); }
        });

        // --- DYNAMISKA LAGER-KNAPPAR & SÖKNING ---
        window.knownLocations = [];
        window.generateLocationButtons = function(data) {
            const container = document.getElementById('location-filter-container');
            if(!container) return;

            let locations = new Set();
            data.forEach(item => {
                if(item.b && item.b.trim() !== '') {
                    if(item.b.length <= 25) {
                        locations.add(item.b.trim().toUpperCase());
                    }
                }
            });

            const uniqueLocs = Array.from(locations).sort();
            window.knownLocations = uniqueLocs.map(l => l.toLowerCase());

            container.innerHTML = `<span class="text-xs font-bold text-slate-400 uppercase mr-1 shrink-0">Lager:</span>
                <button id="loc-btn-ALLA" onclick="window.setLocationFilter('ALLA')" class="loc-btn px-4 py-1.5 rounded-full text-sm font-bold bg-indigo-600 text-white transition-colors shadow-sm shrink-0">Alla</button>`;

            uniqueLocs.forEach(loc => {
                const btn = document.createElement('button');
                btn.id = `loc-btn-${loc}`;
                btn.onclick = () => window.setLocationFilter(loc);
                btn.className = "loc-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm shrink-0";
                btn.textContent = loc.charAt(0) + loc.slice(1).toLowerCase();
                container.appendChild(btn);
            });
        };

        let currentLocFilter = 'ALLA';

        window.setLocationFilter = function(loc) {
            currentLocFilter = loc;
            document.querySelectorAll('.loc-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });
            const activeBtn = document.getElementById('loc-btn-' + loc);
            if(activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                activeBtn.classList.add('bg-indigo-600', 'text-white');
            }
            partInput.dispatchEvent(new Event('input'));
        };

        const partInput = document.getElementById('manual-part-input');
        const dropdown = document.getElementById('autocomplete-dropdown');

        partInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            dropdown.innerHTML = '';
            
            if (val.length < 2 || articleDatabase.length === 0) {
                dropdown.classList.add('hidden'); return;
            }

            const matches = articleDatabase.filter(item => {
                const desc = (item.b || "").toLowerCase();
                
                if (currentLocFilter !== 'ALLA') {
                    const filterLower = currentLocFilter.toLowerCase();
                    const isGeneric = !window.knownLocations.some(loc => desc === loc || desc.includes(loc));
                    const matchesLocation = desc === filterLower || desc.includes(filterLower);
                    if (!isGeneric && !matchesLocation) return false;
                }

                const searchStr = item.a.toLowerCase() + " " + item.t.toLowerCase() + " " + (item.m || "").toLowerCase() + " " + desc;
                const searchTerms = val.split(' ').filter(t => t.length > 0);
                return searchTerms.every(term => searchStr.includes(term));

            }).slice(0, 15);

            if (matches.length > 0) {
                dropdown.classList.remove('hidden');
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'p-3 hover:bg-indigo-50 cursor-pointer flex flex-col gap-1 transition-colors';
                    const ortTag = match.b ? `<span class="ml-1 text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">${match.b}</span>` : '';
                    div.innerHTML = `
                        <div class="font-bold text-slate-800 leading-tight">${match.a} ${ortTag}</div>
                        <div class="text-xs text-slate-500 leading-tight">${match.t} ${match.m ? `<span class="italic text-indigo-400">(${match.m})</span>` : ''}</div>
                    `;
                    div.onclick = () => {
                        window.addPartToList(match.a);
                        partInput.value = '';
                        dropdown.classList.add('hidden');
                        partInput.focus();
                    };
                    dropdown.appendChild(div);
                });
            } else { dropdown.classList.add('hidden'); }
        });

        document.addEventListener('click', (e) => {
            if(!partInput.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.add('hidden');
            if(!orderInput.contains(e.target) && !orderDropdown.contains(e.target)) orderDropdown.classList.add('hidden');
        });

        // --- STATE ---
        let currentOrderNo = null;
        let scannedParts = []; 
        let itemToDelete = null; 
        let hasUnsavedChanges = false;

        const uiMain = document.getElementById('main-ui');
        const uiStepOrder = document.getElementById('step-order');
        const uiStepParts = document.getElementById('step-parts');
        const orderDisplay = document.getElementById('current-order-display');
        const headerBadge = document.getElementById('header-order-badge');
        const partsListContainer = document.getElementById('parts-list');
        const partCountBadge = document.getElementById('part-count-badge');
        const finishBtn = document.getElementById('finish-btn');
        const orderFinishedCb = document.getElementById('order-finished-cb');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmModalText = document.getElementById('confirm-modal-text');
        const unsavedModal = document.getElementById('unsaved-modal'); 

        lucide.createIcons();

        function updateUI() {
            if (!currentOrderNo) {
                uiStepOrder.classList.remove('hidden'); uiStepOrder.classList.add('flex');
                uiStepParts.classList.add('hidden'); uiStepParts.classList.remove('flex');
                headerBadge.classList.add('hidden');
            } else {
                uiStepOrder.classList.add('hidden'); uiStepOrder.classList.remove('flex');
                uiStepParts.classList.remove('hidden'); uiStepParts.classList.add('flex');
                
                orderDisplay.textContent = currentOrderNo;
                headerBadge.textContent = currentOrderNo;
                headerBadge.classList.remove('hidden');
                renderPartsList();
            }
        }

        function renderPartsList() {
            partsListContainer.innerHTML = '';
            if (scannedParts.length === 0) {
                partCountBadge.classList.add('hidden');
                partsListContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 p-8 text-center gap-2"><i data-lucide="package-open" class="w-12 h-12 opacity-50"></i><p>Inga reservdelar plockade ännu.</p></div>`;
                finishBtn.classList.add('opacity-50', 'cursor-not-allowed');
                finishBtn.classList.remove('hover:bg-indigo-700', 'active:bg-indigo-800');
                lucide.createIcons();
                return;
            }
            partCountBadge.textContent = `${scannedParts.length} st`;
            partCountBadge.classList.remove('hidden');
            finishBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            finishBtn.classList.add('hover:bg-indigo-700', 'active:bg-indigo-800');

            scannedParts.forEach((part, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center justify-between p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors';
                
                const matchedArticle = articleDatabase.find(a => a.a === part.partNo);
                const titleStr = matchedArticle ? `<div class="text-xs text-slate-500 truncate max-w-[120px] sm:max-w-[200px]">${matchedArticle.t}</div>` : '';

                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-100 text-indigo-800 p-2 rounded-lg shrink-0"><i data-lucide="box" class="w-5 h-5"></i></div>
                        <div class="flex flex-col">
                            <div class="font-bold text-slate-800 text-lg leading-tight tracking-wide">${part.partNo}</div>
                            ${titleStr}
                        </div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <div class="flex items-center bg-slate-100 rounded-lg border border-slate-200">
                            <button onclick="window.changeQty(${index}, -1)" class="p-2 text-slate-600 hover:bg-slate-200 rounded-l-lg transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                            <span class="w-8 text-center font-bold text-slate-800 select-none">${part.qty}</span>
                            <button onclick="window.changeQty(${index}, 1)" class="p-2 text-slate-600 hover:bg-slate-200 rounded-r-lg transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                        </div>
                        <button onclick="window.removePart(${index})" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                    </div>`;
                partsListContainer.appendChild(itemDiv);
            });
            lucide.createIcons();
        }

        window.markUnsaved = function() { hasUnsavedChanges = true; };

        function loadOrder(orderNo) {
            if (!currentUser) { window.showToast("Väntar på systemanslutning...", "error"); return; }
            currentOrderNo = orderNo; scannedParts = []; orderFinishedCb.checked = false;
            window.showToast(`Ny plockning startad för ${orderNo}`, 'success');
            hasUnsavedChanges = false;
            updateUI();
        }

        window.setManualOrder = function() {
            const val = orderInput.value;
            if (val.trim() === '') { window.showToast('Du måste ange ett id (t.ex. regnr)', 'error'); return; }
            let formattedOrder = val.trim().toUpperCase();
            const cleanedForAo = formattedOrder.replace(/[^A-Z0-9]/g, '');
            if (cleanedForAo.length >= 5 && /^(?:AO)?\d+$/.test(cleanedForAo)) {
                const match = cleanedForAo.match(/^(?:AO)?(\d{2})(\d+)$/);
                if (match) formattedOrder = `AO-${match[1]}-${match[2]}`;
            }
            orderInput.value = ''; loadOrder(formattedOrder);
        };

        function parsePartNumber(rawInput) {
            let text = rawInput.trim();
            if (text.startsWith('{') && text.endsWith('}')) {
                let innerText = text.substring(1, text.length - 1);
                let segments = innerText.split('|');
                if (segments.length >= 3) return segments[2].trim(); 
            }
            return text;
        }

        window.addPartToList = function(rawPartNumber) {
            if (!rawPartNumber) return;
            const cleanedPartNo = parsePartNumber(rawPartNumber).toUpperCase();
            const existingPartIndex = scannedParts.findIndex(p => p.partNo === cleanedPartNo);
            if (existingPartIndex >= 0) {
                scannedParts[existingPartIndex].qty += 1;
                window.showToast(`Ökade antal för ${cleanedPartNo}`, 'success');
            } else {
                scannedParts.unshift({ partNo: cleanedPartNo, qty: 1 });
                window.showToast(`Lade till reservdel: ${cleanedPartNo}`, 'success');
            }
            window.markUnsaved(); if(navigator.vibrate) navigator.vibrate(50); updateUI();
        };

        window.addManualPart = function() {
            const val = partInput.value;
            if (val.trim() === '') return;
            window.addPartToList(val); partInput.value = ''; dropdown.classList.add('hidden'); partInput.focus();
        };

        partInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.addManualPart(); });
        orderInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.setManualOrder(); });

        window.changeQty = function(index, delta) {
            const newQty = scannedParts[index].qty + delta;
            if (newQty > 0) { scannedParts[index].qty = newQty; window.markUnsaved(); updateUI(); } 
            else { window.removePart(index); }
        };

        window.removePart = function(index) {
            itemToDelete = index;
            confirmModalText.innerHTML = `Är du säker på att du vill ta bort <strong>${scannedParts[index].partNo}</strong> från listan?`;
            confirmModal.classList.remove('hidden'); confirmModal.classList.add('flex'); lucide.createIcons();
        };

        window.confirmRemove = function() {
            if (itemToDelete !== null) { scannedParts.splice(itemToDelete, 1); itemToDelete = null; window.markUnsaved(); updateUI(); }
            window.closeConfirmModal();
        };

        window.cancelRemove = function() { itemToDelete = null; window.closeConfirmModal(); };
        window.closeConfirmModal = function() { confirmModal.classList.add('hidden'); confirmModal.classList.remove('flex'); };

        window.attemptClearOrder = function() {
            if (hasUnsavedChanges) {
                unsavedModal.classList.remove('hidden'); unsavedModal.classList.add('flex'); lucide.createIcons();
            } else { clearOrder(); }
        };

        window.closeUnsavedModal = function() { unsavedModal.classList.add('hidden'); unsavedModal.classList.remove('flex'); };
        window.forceClearOrder = function() { window.closeUnsavedModal(); clearOrder(); };

        function clearOrder() {
            currentOrderNo = null; scannedParts = []; orderFinishedCb.checked = false; hasUnsavedChanges = false; updateUI();
        }

        window.finishOrder = async function() {
            if (scannedParts.length === 0 && !orderFinishedCb.checked) return;
            if (!currentUser) { window.showToast('Ansluter till molnet...', 'error'); return; }

            try {
                const originalText = finishBtn.innerHTML;
                finishBtn.innerHTML = '<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> Skickar...';
                finishBtn.disabled = true; lucide.createIcons();

                const isFinished = orderFinishedCb.checked;
                const uniqueDocId = `${currentOrderNo}-${Date.now()}`;
                const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', uniqueDocId);
                
                await setDoc(orderRef, {
                    orderId: currentOrderNo,
                    parts: scannedParts,
                    isFinished: isFinished,
                    savedBy: currentUser.uid,
                    timestamp: new Date().toISOString(),
                    source: 'chauffor' 
                });

                hasUnsavedChanges = false;
                window.showToast('Artiklar inskickade!', 'success');
                setTimeout(() => {
                    clearOrder(); finishBtn.innerHTML = originalText; finishBtn.disabled = false; lucide.createIcons();
                }, 1000);
            } catch (error) {
                window.showToast('Ett fel uppstod vid sparandet.', 'error');
                finishBtn.innerHTML = '<i data-lucide="save" class="w-6 h-6"></i> Skicka in reservdelar'; finishBtn.disabled = false; lucide.createIcons();
            }
        };

        updateUI();
    </script>
</body>
</html>
